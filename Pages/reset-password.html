<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redefinir Senha - Sistema de Termos</title>
  <link rel="icon" type="image/jpeg" href="../images/logoOMLT.jpeg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link href="../Css/register.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Supabase principal -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <!-- Fallback local -->
  <script>
    if (!window.supabase) {
      console.warn("⚠️ CDN do Supabase falhou, carregando fallback local...");
      const script = document.createElement("script");
      script.src = "../js/libs/supabase.min.js";
      document.head.appendChild(script);
    }
  </script>

  <!-- Script de autenticação -->
  <script src="../js/supabase-auth.js"></script>

  <!-- Sons dos alerts -->
  <script>
    function playSound(type) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      const tones = {
        success: [523, 659, 784],
        error: [523, 392, 262],
        info: [440, 440],
        warning: [440, 880, 440]
      }[type];
      tones.forEach((f, i) => osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.1));
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
      osc.start();
      osc.stop(ctx.currentTime + 0.3);
    }
  </script>
</head>

<body>
  <div class="main-container">
    <div class="container">
      <div class="header">
        <div class="logo">
          <img src="../images/logoOMLT.jpeg" alt="Logo OMLT" />
        </div>
        <h1>Redefinir Senha</h1>
        <p class="subtitle">Crie uma nova senha para sua conta</p>
      </div>

      <form id="resetPasswordForm">
        <div class="form-section">
          <!-- Senha -->
          <div class="form-group">
            <label for="password"><i class="fas fa-lock"></i> Nova Senha</label>
            <div class="input-wrapper">
              <input id="password" type="password" placeholder="Mínimo 6 caracteres" required />
            </div>
          </div>

          <!-- Confirmar senha -->
          <div class="form-group">
            <label for="confirmPassword"><i class="fas fa-lock"></i> Confirmar Nova Senha</label>
            <div class="input-wrapper">
              <input id="confirmPassword" type="password" placeholder="Digite a senha novamente" required />
            </div>
          </div>

          <!-- Botão -->
          <button type="submit" class="btn-primary" id="resetBtn">
            <i class="fas fa-save"></i> Salvar Nova Senha
          </button>
        </div>
      </form>

      <div class="auth-links">
        <p>Lembrou da senha? <a href="../index.html">Faça login aqui</a></p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const resetForm = document.getElementById("resetPasswordForm");
      const resetBtn = document.getElementById("resetBtn");
      const passwordInput = document.getElementById("password");
      const confirmPasswordInput = document.getElementById("confirmPassword");

      let sessionReady = false;

      // Desabilita o formulário até que a sessão esteja pronta
      resetBtn.disabled = true;
      passwordInput.disabled = true;
      confirmPasswordInput.disabled = true;
      resetBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando link...';

      // O cliente Supabase (inicializado em supabase-auth.js) detecta a sessão na URL.
      // Ouvimos o evento PASSWORD_RECOVERY para saber quando é seguro prosseguir.
      const { data: { subscription } } = supabase.auth.onAuthStateChange((event, session) => {
        // Este evento é disparado quando o usuário chega de um link de recuperação de senha.
        if (event === "PASSWORD_RECOVERY") {
          sessionReady = true;

          // Habilita o formulário
          resetBtn.disabled = false;
          passwordInput.disabled = false;
          confirmPasswordInput.disabled = false;
          resetBtn.innerHTML = '<i class="fas fa-save"></i> Salvar Nova Senha';

          // Já temos a sessão, não precisamos mais ouvir o evento.
          subscription.unsubscribe();
        } else if (event === "INITIAL_SESSION" && !session) {
          // Caso a página seja carregada sem um token válido na URL.
          playSound("error");
          Swal.fire({
            icon: "error",
            title: "Link inválido ou expirado",
            text: "Este link de redefinição de senha não é válido. Por favor, solicite um novo na página de login.",
            allowOutsideClick: false,
            confirmButtonText: 'Ir para o Login'
          }).then(() => { window.location.href = "../index.html"; });
        }
      });

      resetForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        if (!sessionReady) {
          playSound("error");
          Swal.fire({ icon: "error", text: "A sessão de redefinição não foi estabelecida. O link pode ser inválido.", toast: true, position: "top-end", timer: 4000 });
          return;
        }

        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (password !== confirmPassword) {
          playSound("error");
          return Swal.fire({ icon: "error", text: "As senhas não coincidem.", toast: true, position: "top-end", timer: 3000 });
        }

        resetBtn.disabled = true;
        resetBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando...';

        try {
          // O usuário está autenticado temporariamente, então podemos atualizar a senha.
          await window.authSupabase.updatePassword(password);

          playSound("success");
          Swal.fire({ icon: "success", title: "Senha alterada!", text: "Sua senha foi atualizada com sucesso. Você será redirecionado para o login.", timer: 2500, showConfirmButton: false, allowOutsideClick: false })
            .then(() => { window.location.href = "../index.html"; });
        } catch (err) {
          playSound("error");
          Swal.fire({ icon: "error", title: "Erro!", text: err.message, toast: true, timer: 4000, position: "top-end" });
          resetBtn.disabled = false;
          resetBtn.innerHTML = '<i class="fas fa-save"></i> Salvar Nova Senha';
        }
      });
    });
  </script>

</body>

</html>
